<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Login</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div class="wrap"><h1>Guess the Word</h1><h2>Login</h2>
<p class="err" th:if="${error}" th:text="${error}"></p><p class="info" th:if="${info}" th:text="${info}"></p>
<form method="post" th:action="@{/login}">
 <input type="text" name="username" placeholder="Username" required>
 <input type="password" name="password" placeholder="Password" required>
 <button type="submit">Log in</button>
</form><p>New here? <a th:href="@{/register}">Register</a></p></div></body></html>
